# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-ifc6410"
BBFILE_PATTERN_meta-ifc6410 = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-ifc6410 = "10"

LAYERDEPENDS_meta-ifc6410 = "core qcom"
LAYERSERIES_COMPAT_meta-ifc6410 = "scarthgap"
