# Built-in Firmware
CONFIG_FW_LOADER=y
CONFIG_EXTRA_FIRMWARE_DIR="firmware"
CONFIG_EXTRA_FIRMWARE="regulatory.db regulatory.db.p7s qcom/a300_pfp.fw qcom/a300_pm4.fw rtl_nic/rtl8153a-4.fw rtl_nic/rtl8153b-2.fw ath6k/AR6004/hw3.0/bdata.bin ath6k/AR6004/hw3.0/fw-5.bin ar3k/ath3k-1.fw ar3k/1020201/RamPatch.txt ar3k/1020201/PS_ASIC.pst"

# Core CPUFreq framework
CONFIG_CPU_FREQ=y
CONFIG_CPU_FREQ_STAT=y
CONFIG_CPU_FREQ_GOV_PERFORMANCE=y
CONFIG_CPU_FREQ_GOV_ONDEMAND=y
CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y
# CONFIG_CPU_FREQ_DEFAULT_GOV_PERFORMANCE is not set
# CONFIG_CPU_FREQ_DEFAULT_GOV_ONDEMAND is not set
CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=y

# Qualcomm Krait Clock & Cpufreq Drivers
CONFIG_ARM_QCOM_CPUFREQ_NVMEM=y
CONFIG_KRAITCC=y
CONFIG_KRAIT_CLOCKS=y
CONFIG_KRAIT_L2_ACCESSORS=y
CONFIG_COMMON_CLK_QCOM=y
CONFIG_NVMEM_QCOM_QFPROM=y
CONFIG_PM_OPP=y

# CPU IDLE support for scaling
CONFIG_CPU_IDLE=y
CONFIG_CPU_IDLE_MULTIPLE_DRIVERS=y
CONFIG_CPU_IDLE_GOV_MENU=y
CONFIG_DT_IDLE_STATES=y
CONFIG_ARM_QCOM_SPM_CPUIDLE=y
CONFIG_QCOM_SPM=y

# Power, Buttons & Clocks
CONFIG_PM=y
CONFIG_PM_DEVFREQ=y
CONFIG_DEVFREQ_GOV_SIMPLE_ONDEMAND=y
CONFIG_KEYBOARD_PMIC8XXX=y

# Storage & USB Core (Mandatory for Root on USB Enclosure)
CONFIG_USB_SUPPORT=y
CONFIG_USB=y
CONFIG_USB_EHCI_HCD=y
CONFIG_USB_CHIPIDEA=y
CONFIG_USB_CHIPIDEA_MSM=y
CONFIG_SCSI=y
CONFIG_SCSI_MOD=y
CONFIG_BLK_DEV_SD=y
CONFIG_USB_STORAGE=y
CONFIG_USB_STORAGE_DEBUG=y
CONFIG_USB_UAS=y
CONFIG_EXT4_FS=y
CONFIG_EXT4_FS_POSIX_ACL=y
CONFIG_EXT4_FS_SECURITY=y

# --- Wi-Fi Subsystem & Atheros AR6004 Built-in ---
CONFIG_WLAN=y
CONFIG_CFG80211=y
CONFIG_CFG80211_WEXT=y
CONFIG_MAC80211=y
CONFIG_NET_CORE=y
CONFIG_ATH6KL=y
CONFIG_ATH6KL_SDIO=y
CONFIG_ATH6KL_DEBUG=y

# --- DRM, MSM Display Controller, Adreno GPU & HDMI Transmitter ---
CONFIG_DRM=y
CONFIG_DRM_MSM=y
CONFIG_DRM_MSM_GPU_STATE=y
CONFIG_DRM_MSM_MDP4=y
CONFIG_DRM_MSM_HDMI=y
CONFIG_DRM_MSM_HDMI_HDCP=n
CONFIG_DEVFREQ_THERMAL=y

# --- HDMI Audio & APQ8064 LPASS Audio ---
CONFIG_SOUND=y
CONFIG_SND=y
CONFIG_SND_SOC=y
CONFIG_SND_SOC_QCOM=y
CONFIG_SND_SOC_HDMI_CODEC=y

# Docker / Container Requirements
CONFIG_NAMESPACES=y
CONFIG_NET_NS=y
CONFIG_PID_NS=y
CONFIG_IPC_NS=y
CONFIG_UTS_NS=y
CONFIG_USER_NS=y
CONFIG_CGROUPS=y
CONFIG_MEMCG=y
CONFIG_BLK_CGROUP=y
CONFIG_CGROUP_SCHED=y
CONFIG_CGROUP_PIDS=y
CONFIG_CGROUP_FREEZER=y
CONFIG_CGROUP_DEVICE=y
CONFIG_CGROUP_CPUACCT=y
CONFIG_CGROUP_BPF=y
CONFIG_BPF=y
CONFIG_BPF_SYSCALL=y
CONFIG_NETFILTER=y
CONFIG_IP_NF_IPTABLES=y
CONFIG_IP_NF_FILTER=y
CONFIG_IP_NF_NAT=y
CONFIG_IP_NF_TARGET_MASQUERADE=y
CONFIG_BRIDGE=y
CONFIG_VETH=y
CONFIG_OVERLAY_FS=y

# ==============================================================================
# BPF & NETFILTER / IPTABLES / NFTABLES (Bridge & NAT for Docker)
# ==============================================================================
CONFIG_NETFILTER_ADVANCED=y
CONFIG_BRIDGE_NETFILTER=y
CONFIG_NF_CONNTRACK=y
CONFIG_NF_TABLES=y
CONFIG_NF_TABLES_INET=y
CONFIG_NF_TABLES_NETDEV=y
CONFIG_NFT_NUMGEN=y
CONFIG_NFT_CT=y
CONFIG_NFT_LOG=y
CONFIG_NFT_LIMIT=y
CONFIG_NFT_MASQ=y
CONFIG_NFT_REDIR=y
CONFIG_NFT_NAT=y
CONFIG_NFT_REJECT=y
CONFIG_NFT_COMPAT=y
CONFIG_NETFILTER_XTABLES=y
CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
CONFIG_NETFILTER_XT_MATCH_COMMENT=y
CONFIG_NETFILTER_XT_MATCH_IPVS=y
CONFIG_NETFILTER_XT_MARK=y
CONFIG_NETFILTER_XT_NAT=y
CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y
CONFIG_NETFILTER_XT_TARGET_REDIRECT=y
CONFIG_IP_NF_TARGET_REJECT=y
CONFIG_IP_NF_MANGLE=y
CONFIG_MACVLAN=y
CONFIG_DUMMY=y

# ==============================================================================
# DRM Bridges & Display Connector
# ==============================================================================
CONFIG_DRM_BRIDGE=y
CONFIG_DRM_PANEL_BRIDGE=y
CONFIG_DRM_DISPLAY_CONNECTOR=y

# ==============================================================================
# Wireless Regulatory Support
# ==============================================================================
CONFIG_CFG80211_REQUIRE_SIGNED_REGDB=y
CONFIG_CFG80211_USE_KERNEL_REGDB_KEYS=y

# Disable hw watchdog timer
CONFIG_QCOM_WDT=n

# autofs
CONFIG_AUTOFS_FS=y
CONFIG_BINFMT_MISC=y

# ==============================================================================
# Bluetooth Atheros / Qualcomm HCI UART Drivers
# ==============================================================================
CONFIG_BT_HCIUART_ATH3K=y
CONFIG_BT_HCIUART_QCA=y
CONFIG_BT_HCIUART_LL=y
CONFIG_BT_ATH3K=y

# ==============================================================================
# APQ8064 Thermal & Mitigation
# ==============================================================================
CONFIG_THERMAL=y
CONFIG_THERMAL_OF=y
CONFIG_THERMAL_GOV_STEP_WISE=y
CONFIG_CPU_THERMAL=y
CONFIG_QCOM_TSENS=y

# ==============================================================================
# APQ8064 Clock Trees & Interconnects
# ==============================================================================
CONFIG_QCOM_CLK_RPM=y
CONFIG_MSM_GCC_8960=y
CONFIG_MSM_LCC_8960=y
CONFIG_INTERCONNECT=y
CONFIG_INTERCONNECT_QCOM=y

# ==============================================================================
# Qualcomm SLIMbus & Onboard WCD9310 Audio Codec (3.5mm Jack)
# ==============================================================================
CONFIG_SLIMBUS=y
CONFIG_SLIM_QCOM_CTRL=y
CONFIG_SLIM_QCOM_NGD_CTRL=y

# ==============================================================================
# Bluetooth Core & Sockets (Required for HCIUART drivers)
# ==============================================================================
CONFIG_BT=y
CONFIG_BT_BREDR=y
CONFIG_BT_RFCOMM=y
CONFIG_BT_RFCOMM_TTY=y
CONFIG_BT_BNEP=y
CONFIG_BT_HIDP=y
CONFIG_BT_HCIUART=y

# ==============================================================================
# PM8921 Power-off and Reboot Handlers
# ==============================================================================
CONFIG_POWER_RESET=y
CONFIG_POWER_RESET_MSM=y
CONFIG_POWER_RESET_QCOM_PON=y
CONFIG_POWER_RESET_SYSCON=y
CONFIG_POWER_RESET_SYSCON_POWEROFF=y

# ==============================================================================
# --- Onboard Native SATA & PCIe Controllers ---
# ==============================================================================
CONFIG_ATA=y
CONFIG_SATA_AHCI=y
CONFIG_SATA_AHCI_PLATFORM=y
CONFIG_PHY_QCOM_APQ8064_SATA=y
CONFIG_PCIE_DW_HOST=y
CONFIG_PCIE_QCOM=y
CONFIG_PHY_QCOM_QMP=y
CONFIG_PHY_QCOM_QMP_PCIE=y

# --- USB HSIC PHY ---
CONFIG_PHY_QCOM_USB_HSIC=y
CONFIG_USB_HSIC_USB4604=y

# ==============================================================================
# --- Qualcomm Crypto Engine (QCE) Hardware Acceleration (Module) ---
# ==============================================================================
CONFIG_CRYPTO_HW=y
CONFIG_DMADEVICES=y
CONFIG_QCOM_BAM_DMA=y
CONFIG_CRYPTO_DEV_QCOM_RNG=m

# Exact QCE configuration verified via diffconfig
CONFIG_CRYPTO_XTS=m
CONFIG_CRYPTO_LIB_DES=m
CONFIG_CRYPTO_DEV_QCE=m
CONFIG_CRYPTO_DEV_QCE_SKCIPHER=y
CONFIG_CRYPTO_DEV_QCE_SHA=y
CONFIG_CRYPTO_DEV_QCE_AEAD=y
CONFIG_CRYPTO_DEV_QCE_ENABLE_ALL=y
CONFIG_CRYPTO_DEV_QCE_SW_MAX_LEN=512

# Core ciphers
CONFIG_CRYPTO_SKCIPHER=y
CONFIG_CRYPTO_HASH=y
CONFIG_CRYPTO_AEAD=y
CONFIG_CRYPTO_AES=y
CONFIG_CRYPTO_ECB=y
CONFIG_CRYPTO_CTR=y
CONFIG_CRYPTO_SHA256=y
CONFIG_CRYPTO_LIB_AES=y

